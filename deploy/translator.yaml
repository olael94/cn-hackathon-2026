apiVersion: apps/v1
kind: Deployment
metadata:
  name: translator
  labels:
    app: translator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: translator
  template:
    metadata:
      labels:
        app: translator
    spec:
      automountServiceAccountToken: false
      containers:
        - name: translator
          image: backend
          command: ["opentelemetry-instrument", "python", "-m", "roompass", "api"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: OTEL_SERVICE_NAME
              value: translator
            - name: FLAGD_HOST
              value: flagd
            - name: FLAGD_PORT
              value: "8013"
          envFrom:
            - secretRef:
                name: otel
                optional: true
            - secretRef:
                name: openai
                optional: true
            - secretRef:
                name: elastic
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: translator
  labels:
    app: translator
spec:
  selector:
    app: translator
  ports:
    - name: http
      port: 80
      targetPort: http
