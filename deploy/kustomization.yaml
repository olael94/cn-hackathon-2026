# Argo CD deploys this folder to your team's namespace. The GitHub Action
# sets the images below on every push to main; don't edit newName or newTag
# by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: team-the-mok-team
resources:
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - backend.yaml
  - translator.yaml
  - flagd.yaml
  - pdb.yaml
images:
  - name: web
    newName: ghcr.io/olael94/cn-hackathon-2026
    newTag: "web-dd2c046"
  - name: backend
    newName: ghcr.io/olael94/cn-hackathon-2026
    newTag: backend-dd2c046
