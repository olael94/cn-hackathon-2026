apiVersion: v1
kind: ConfigMap
metadata:
  name: flagd-flags
  labels:
    app: flagd
data:
  flags.json: |
    {
      "$schema": "https://flagd.dev/schema/v0/flags.json",
      "flags": {
        "translator-chaos-delay-ms": {
          "state": "ENABLED",
          "variants": {
            "off": 0,
            "on": 4000
          },
          "defaultVariant": "off"
        },
        "translator-fallback": {
          "state": "ENABLED",
          "variants": {
            "off": false,
            "on": true
          },
          "defaultVariant": "off"
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagd
  labels:
    app: flagd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flagd
  template:
    metadata:
      labels:
        app: flagd
    spec:
      containers:
        - name: flagd
          image: ghcr.io/open-feature/flagd:v0.18.2
          args: ["start", "--uri", "file:/etc/flagd/flags.json"]
          ports:
            - name: grpc
              containerPort: 8013
            - name: management
              containerPort: 8014
            - name: ofrep
              containerPort: 8016
          volumeMounts:
            - name: flags
              mountPath: /etc/flagd
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: management
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: management
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: flags
          configMap:
            name: flagd-flags
---
apiVersion: v1
kind: Service
metadata:
  name: flagd
  labels:
    app: flagd
spec:
  selector:
    app: flagd
  ports:
    - name: grpc
      port: 8013
      targetPort: grpc
    - name: ofrep
      port: 8016
      targetPort: ofrep
