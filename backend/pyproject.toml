[project]
name = "backend"
version = "0.1.0"
description = "RoomPass backend: api, pipeline and translator processes"
requires-python = ">=3.13"
dependencies = [
    "elasticsearch[async]>=9.5.1",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "openai>=3.48.0",
    "opentelemetry-distro>=0.66b2",
    "opentelemetry-exporter-otlp>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "python-multipart>=0.0.33",
    "sse-starlette>=3.7.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.91.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
extend-exclude = ["roompass/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
