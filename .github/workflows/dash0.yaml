name: dash0-apply

on:
  push:
    branches: [main]
    paths:
      - dash0/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dash0hq/dash0-cli/.github/actions/setup@v1.20.0
        with:
          version: 1.20.0

      - name: Apply dashboard, alerts, SLOs and uptime check
        env:
          DASH0_API_URL: https://api.us-west-2.aws.dash0.com
          DASH0_AUTH_TOKEN: ${{ secrets.DASH0_API_TOKEN }}
          DASH0_DATASET: default
        run: dash0 apply -f dash0/
