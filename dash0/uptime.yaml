apiVersion: dash0.com/v1alpha1
kind: SyntheticCheck
metadata:
  name: RoomPass public URL
  labels:
    dash0.com/id: roompass-public-url
spec:
  enabled: true
  notifications:
    channels: []
  plugin:
    display:
      name: RoomPass public URL
    kind: http
    spec:
      assertions:
        criticalAssertions:
          - kind: status_code
            spec:
              value: "200"
              operator: is
          - kind: timing
            spec:
              type: response
              value: 5000ms
              operator: lte
        degradedAssertions:
          - kind: timing
            spec:
              type: response
              value: 1000ms
              operator: lte
      request:
        method: get
        url: https://the-mok-team.cnh.radarhq.io/api/health
        queryParameters: []
        headers: []
        redirects: follow
        tls:
          allowInsecure: false
        tracing:
          addTracingHeaders: true
  retries:
    kind: fixed
    spec:
      attempts: 2
      delay: 1s
  schedule:
    interval: 1m
    locations:
      - us-oregon
    strategy: all_locations
